<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step Challenge Leaderboard — KVN Fitness</title>
<link rel="icon" type="image/png" sizes="32x32" href="../project30/project30-icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../project30/project30-icons/favicon-16.png">
<link rel="apple-touch-icon" href="../project30/project30-icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.stat__value{font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(20px,3vw,28px);color:var(--text-strong)}

.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:16px;padding:14px 18px}
.row--1{border-color:var(--neon);box-shadow:0 0 22px -6px var(--neon),inset 0 0 22px -12px var(--neon)}
.row--2,.row--3{border-color:color-mix(in srgb,var(--neon) 55%,transparent)}
.rank{font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;color:var(--muted)}
.row--1 .rank,.row--2 .rank,.row--3 .rank{color:var(--neon)}
.who{display:flex;flex-direction:column;gap:6px;min-width:0}
.name{font-size:22px;font-weight:700;color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:rgba(255,255,255,.06)}
.bar__fill{height:100%;background:var(--neon);box-shadow:0 0 8px var(--neon)}
.meta{font-size:15px;color:var(--muted)}
.total{text-align:right;font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(18px,2.6vw,24px);color:var(--text-strong);white-space:nowrap}
.total small{display:block;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;letter-spacing:.1em;color:var(--muted)}
.foot{font-size:15px;color:var(--muted)}

@media (max-width:640px){
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:first-child{grid-column:1 / -1}
  .row{grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:12px 14px}
  .rank{font-size:18px}
  .name{font-size:19px}
}
</style>
</head>
<body>
<div class="app">
  <div class="floor" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>
  <div class="streak" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"><div class="progress__bar" id="progress"></div></div>

  <header class="header">
    <div class="brand">
      <a class="brand__home" href="https://kvnngon.com/" aria-label="KVN Fitness home">
        <div class="emblem-wrap"><span class="emblem" aria-hidden="true"></span></div>
        <div class="wordmark" aria-hidden="true">
          <span class="wordmark__kvn glow">KVN</span>
          <span class="wordmark__sub">FITNESS</span>
        </div>
      </a>
      <span class="divider" aria-hidden="true"></span>
      <span class="tag">PROJECT 30 // STEP CHALLENGE</span>
    </div>
    <span class="counter" id="counter"></span>
  </header>

  <main class="main">
    <div class="stage screen">
      <span class="eyebrow" id="dates"></span>
      <h1 class="title glow">LEADERBOARD</h1>
      <p class="lead">Total steps across the 30-day challenge. Updated daily.</p>

      <div class="stats">
        <div class="panel stat"><span class="label">Challenge day</span><span class="stat__value" id="statDay">—</span></div>
        <div class="panel stat"><span class="label">Total steps</span><span class="stat__value" id="statTotal">—</span></div>
        <div class="panel stat"><span class="label">Challengers</span><span class="stat__value" id="statPeople">—</span></div>
      </div>

      <ol class="board" id="board" aria-live="polite"></ol>
      <p class="foot" id="foot"></p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const T = CONFIG.totalDays;

  function renderDay() {
    const d = todayDay();
    $("dates").textContent = `${dayLabel(1, { day: "numeric", month: "short" })} – ${dayLabel(T, { day: "numeric", month: "short", year: "numeric" })}`.toUpperCase();
    $("counter").textContent = d < 1 ? "STARTS SOON" : d > T ? "COMPLETE" : `DAY ${pad(d)} / ${T}`;
    $("statDay").textContent = d < 1 ? "Not started" : d > T ? "Finished" : `${d} of ${T}`;
    $("progress").style.width = (Math.min(d, T) / T) * 100 + "%";
  }

  function renderBoard(data) {
    const list = standings(data);
    const top = list[0]?.total || 0;
    $("statTotal").textContent = fmt(list.reduce((s, c) => s + c.total, 0));
    $("statPeople").textContent = list.length;

    if (!list.length) {
      $("board").innerHTML = `<li class="panel meta">No challengers yet. Check back soon.</li>`;
      $("foot").textContent = "";
      return;
    }
    $("board").innerHTML = list.map((c) => {
      const avg = c.days ? c.total / c.days : 0;
      const pct = top ? (c.total / top) * 100 : 0;
      return `<li class="panel row row--${c.rank}">
        <span class="rank">${pad(c.rank)}</span>
        <div class="who">
          <span class="name">${esc(c.name)}</span>
          <div class="bar"><div class="bar__fill" style="width:${pct}%"></div></div>
          <span class="meta">${c.days} day${c.days === 1 ? "" : "s"} logged · ${fmt(avg)} avg/day</span>
        </div>
        <span class="total">${fmt(c.total)}<small>STEPS</small></span>
      </li>`;
    }).join("");

    const last = data.steps.reduce((m, s) => (s.updated_at > m ? s.updated_at : m), "");
    $("foot").textContent = last
      ? "Last updated " + new Date(last).toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })
      : "";
  }

  async function refresh() {
    renderDay();
    if (!db) { $("board").innerHTML = `<li class="panel meta">The leaderboard isn't connected yet.</li>`; return; }
    try {
      renderBoard(await loadChallenge());
    } catch (e) {
      console.error(e);
      if (!$("board").children.length) $("board").innerHTML = `<li class="panel error">Couldn't load the leaderboard. Refresh to try again.</li>`;
    }
  }

  refresh();
  setInterval(refresh, 60000);
})();
</script>
</body>
</html>
