.floor{position:absolute;left:-60%;right:-60%;bottom:0;height:42%;
  background-image:linear-gradient(color-mix(in srgb,var(--neon) 38%,transparent) 1px,transparent 1px),
                   linear-gradient(90deg,color-mix(in srgb,var(--neon) 38%,transparent) 1px,transparent 1px);
  background-size:72px 72px;transform:perspective(380px) rotateX(64deg);transform-origin:top center;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 55%);mask-image:linear-gradient(to bottom,transparent 0%,#000 55%);
  animation:floor 3.2s linear infinite;pointer-events:none}
@keyframes floor{to{background-position:0 72px}}
.horizon{position:absolute;left:0;right:0;bottom:42%;height:1px;background:var(--neon);
  box-shadow:0 0 14px 1px var(--neon),0 0 60px 6px color-mix(in srgb,var(--neon) 35%,transparent);opacity:.75;pointer-events:none}
.streak{position:absolute;bottom:calc(42% - 1px);left:-30%;width:28%;height:3px;
  background:linear-gradient(90deg,transparent,var(--neon) 85%,#fff);box-shadow:0 0 16px 2px var(--neon);border-radius:2px;
  animation:streak 5.5s cubic-bezier(.6,0,.4,1) infinite;pointer-events:none}
@keyframes streak{0%{transform:translateX(0)}60%,100%{transform:translateX(480%)}}

/* ---------- Progress bar ---------- */
.progress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.06);z-index:3}
.progress__bar{height:3px;width:0;background:var(--neon);box-shadow:0 0 12px 1px var(--neon);transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- Header / logo ---------- */
.header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:28px 32px}
.brand{display:flex;align-items:center;gap:12px}
.emblem-wrap{display:flex;filter:drop-shadow(0 0 3px var(--neon)) drop-shadow(0 0 14px color-mix(in srgb,var(--neon) 60%,transparent));animation:flicker 6s steps(1) infinite}
.emblem{display:block;width:34px;height:56px;background:var(--neon);
  -webkit-mask:var(--emblem) center/contain no-repeat;mask:var(--emblem) center/contain no-repeat}
@keyframes flicker{0%,92%,94%,97%,100%{opacity:1}93%{opacity:.55}96%{opacity:.7}}
.wordmark{display:flex;flex-direction:column;gap:3px}
.wordmark__kvn{font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;line-height:1;letter-spacing:.18em;color:var(--neon)}
.wordmark__sub{font-family:'Orbitron',sans-serif;font-weight:500;font-size:9px;line-height:1;letter-spacing:.52em;color:var(--text-body)}
.divider{width:1px;height:30px;margin:0 6px;background:color-mix(in srgb,var(--neon) 40%,transparent)}
.tag,.counter{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.22em;color:var(--muted)}
.counter{font-size:13px;letter-spacing:.2em}

/* ---------- Main stage ---------- */
.main{position:relative;z-index:2;flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:24px 24px 140px}
.stage{width:100%;max-width:760px}
.screen{display:flex;flex-direction:column;gap:24px;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

.glow{text-shadow:0 0 6px color-mix(in srgb,var(--neon) 75%,transparent),0 0 24px color-mix(in srgb,var(--neon) 45%,transparent)}
.eyebrow{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.3em;color:var(--muted)}
.title{margin:0;font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(40px,7vw,80px);line-height:1.02;letter-spacing:.02em;color:var(--neon)}
.lead{margin:0;max-width:560px;font-size:clamp(20px,2.4vw,24px);line-height:1.4;font-weight:500;color:var(--text-body)}

.q{display:flex;gap:16px;align-items:baseline;margin:0}
.q__num{font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--neon);white-space:nowrap}
.q__text{margin:0;font-size:clamp(28px,3.8vw,42px);font-weight:700;line-height:1.12;color:var(--text-strong)}
.help{margin:-8px 0 0 52px;font-size:18px;color:var(--muted)}

.field{width:100%;background:transparent;border:0;border-bottom:2px solid color-mix(in srgb,var(--neon) 40%,transparent);
  color:var(--text-strong);font-family:'Rajdhani',sans-serif;font-weight:500;font-size:clamp(24px,3vw,34px);padding:10px 0;
  outline:none;caret-color:var(--neon);transition:border-color .2s,box-shadow .2s;resize:none}
.field::placeholder{color:var(--placeholder)}
.field:focus{border-bottom-color:var(--neon);box-shadow:0 10px 18px -14px var(--neon)}

.choices{display:flex;flex-direction:column;gap:12px;max-width:520px}
.choices--grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:620px}
.choice{display:flex;align-items:center;gap:16px;width:100%;min-height:60px;padding:12px 18px;background:rgba(255,255,255,.02);
  border:1px solid color-mix(in srgb,var(--neon) 35%,transparent);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:22px;
  font-weight:600;text-align:left;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}
.choice:hover{background:color-mix(in srgb,var(--neon) 9%,transparent);border-color:var(--neon)}
.choice.is-on{background:color-mix(in srgb,var(--neon) 16%,transparent);border-color:var(--neon);box-shadow:0 0 18px -4px var(--neon),inset 0 0 18px -8px var(--neon)}
.choice__key{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--neon);color:var(--neon);font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700}
.choice.is-on .choice__key{background:var(--neon);color:var(--bg)}
.choice__label{flex:1 1 auto}
.choice__check{color:var(--neon);visibility:hidden}
.choice.is-on .choice__check{visibility:visible}

.actions{display:flex;flex-direction:column;gap:16px;margin-top:32px;padding-left:52px}
.actions__row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hint{font-size:16px;color:var(--muted)}
.hint strong{color:var(--text);font-weight:700}
.error{margin:0;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:var(--error)}

.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 26px;background:color-mix(in srgb,var(--neon) 8%,transparent);
  color:var(--neon);border:1.5px solid var(--neon);font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px;letter-spacing:.18em;cursor:pointer;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  box-shadow:inset 0 0 14px color-mix(in srgb,var(--neon) 30%,transparent);transition:background .15s,color .15s}
.btn:hover{background:var(--neon);color:var(--bg)}
.btn--solid{background:var(--neon);color:var(--bg)}
.btn--solid:hover{background:var(--neon-hover)}
.btn[disabled]{opacity:.6;cursor:progress}

.nav{position:absolute;right:32px;bottom:32px;z-index:3;display:flex;gap:6px}
.navbtn{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);color:var(--neon);border:1px solid color-mix(in srgb,var(--neon) 50%,transparent);cursor:pointer}
.navbtn:hover{border-color:var(--neon);box-shadow:0 0 12px -2px var(--neon)}
.navbtn:disabled{opacity:.35;cursor:default;box-shadow:none}

.btn:focus-visible,.choice:focus-visible,.navbtn:focus-visible{outline:2px solid #fff;outline-offset:3px}
[hidden]{display:none!important}

.done-icon{color:var(--neon);filter:drop-shadow(0 0 10px var(--neon))}
.done-title{margin:0;font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(34px,5.5vw,60px);line-height:1.05;color:var(--neon)}
.done-text{margin:0;max-width:560px;font-size:22px;line-height:1.45;font-weight:500;color:var(--text-body)}
.done-text strong{color:var(--text-strong)}

@media (max-width:640px){
  .header{padding:20px}
  .tag,.divider{display:none}
  .help,.actions{margin-left:0;padding-left:0}
  .choices--grid{grid-template-columns:1fr}
  .nav{right:20px;bottom:20px}
}
@media (prefers-reduced-motion:reduce){
  .floor,.streak,.screen,.emblem-wrap{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="floor" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>
  <div class="streak" aria-hidden="true"></div>

  <div class="progress" aria-hidden="true"><div class="progress__bar" id="progress"></div></div>

  <header class="header">
    <div class="brand">
      <div class="emblem-wrap"><span class="emblem" role="img" aria-label="KVN Fitness"></span></div>
      <div class="wordmark">
        <span class="wordmark__kvn glow">KVN</span>
        <span class="wordmark__sub">FITNESS</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <span class="tag">PROJECT 30 // INTAKE FORM</span>
    </div>
    <span class="counter" id="counter" hidden></span>
  </header>

  <main class="main">
    <!-- Screens are rendered into #stage by the script below -->
    <div class="stage" id="stage" aria-live="polite"></div>
  </main>

  <nav class="nav" id="nav" aria-label="Question navigation" hidden>
    <button type="button" class="navbtn" id="prevBtn" aria-label="Previous question">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 11.5l5-5 5 5" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button type="button" class="navbtn" id="nextBtn" aria-label="Next question">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 6.5l5 5 5-5" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </nav>
</div>

<script>
/* ==========================================================================
   CONFIG — edit the copy and questions here.
   Question types: "text" | "email" | "url" | "textarea" | "choice"
   ========================================================================== */
const CONFIG = {
  welcome: {
    eyebrow: "APPLICATIONS OPEN",
    title: "PROJECT 30",
    lead: "ascension starts 16th november 2026",
    button: "BEGIN"
  },
  questions: [
    { id: "name",  type: "text",  required: true, autocomplete: "name",
      label: "What should we call you on the Grid?", placeholder: "Type your full name",
      error: "A name is required to enter the Grid." },
    { id: "email", type: "email", required: true, autocomplete: "email",
      label: "Where do we transmit our response, {firstName}?",
      help: "We only use this to contact you about your application.",
      placeholder: "name@example.com",
      error: "That address will not route. Check the format." },
    { id: "track", type: "choice", required: true,
      label: "Which division are you applying to?",
      options: ["Systems Engineering", "Interface Design", "Security & Defense", "Grid Architecture"],
      error: "Select a division to continue." },
    { id: "experience", type: "choice", required: true, layout: "grid",
      label: "How long have you been writing programs?",
      options: ["Under 1 year", "1–3 years", "4–7 years", "8+ years"],
      error: "Select your experience level." },
    { id: "why", type: "textarea", required: true,
      label: "If you had the Grid to yourself for one cycle, what would you build?",
      help: "Shift + Enter for a new line.", placeholder: "Type your answer here…",
      error: "Give us at least a sentence." },
    { id: "link", type: "url", required: false,
      label: "Link us to something you have made.",
      help: "Optional. A portfolio, repository, or anything that shows your work.",
      placeholder: "https://" }
  ],
  done: {
    eyebrow: "TRANSMISSION COMPLETE",
    title: "Identity disc written.",
    text: "Thanks, {firstName}. Your application to {track} is in the system. We will contact you at <strong>{email}</strong>."
  }
};

/* ==========================================================================
   SUBMIT HOOK — replace this with a real backend call.
   Receives a plain object: { name, email, track, experience, why, link }.
   Throw an Error to show a message to the applicant.
   ========================================================================== */
async function submitApplication(data) {
  console.log("[Project 30] application submitted:", data);
  // Example:
  // const res = await fetch("/api/applications", {
  //   method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
  // });
  // if (!res.ok) throw new Error("Transmission failed. Try again.");
}

/* ==========================================================================
   APP
   ========================================================================== */
(function () {
  const Q = CONFIG.questions;
  const TOTAL = Q.length;
  const KEYS = "ABCDEFGHIJ";
  const state = { step: 0, answers: {}, error: "", submitting: false };

  const $stage = document.getElementById("stage");
  const $progress = document.getElementById("progress");
  const $counter = document.getElementById("counter");
  const $nav = document.getElementById("nav");
  const $prev = document.getElementById("prevBtn");
  const $next = document.getElementById("nextBtn");
  let advanceTimer = null;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const firstName = () => (state.answers.name || "").trim().split(/\s+/)[0] || "User";
  const fill = (tpl) => tpl
    .replace("{firstName}", esc(firstName()))
    .replace("{track}", esc(state.answers.track || "the Grid"))
    .replace("{email}", esc(state.answers.email || ""));

  const ICON_ARROW = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2"/></svg>';
  const ICON_OK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5" stroke="currentColor" stroke-width="2"/></svg>';
  const ICON_CHECK = '<svg class="choice__check" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 9.5l4 4 8-9" stroke="currentColor" stroke-width="2.2"/></svg>';
  const ICON_WARN = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.5l7 12.5H1z M8 6.5v3.5 M8 11.8v.4" stroke="currentColor" stroke-width="1.6"/></svg>';

  function validate(q) {
    const v = (state.answers[q.id] || "").trim();
    if (q.required && !v) return q.error || "This field is required.";
    if (q.type === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return q.error;
    return "";
  }

  function renderWelcome() {
    const w = CONFIG.welcome;
    return `<div class="screen" style="gap:28px">
      <span class="eyebrow">${esc(w.eyebrow)}</span>
      <h1 class="title glow">${esc(w.title)}</h1>
      <p class="lead">${esc(w.lead)}</p>
      <div class="actions__row"><button type="button" class="btn btn--solid" data-action="next">${esc(w.button)} ${ICON_ARROW}</button></div>
    </div>`;
  }

  function renderQuestion(q, i) {
    const num = `<span class="q__num glow">${pad(i + 1)} ▸</span>`;
    const help = q.help ? `<p class="help">${esc(q.help)}</p>` : "";
    const val = esc(state.answers[q.id] || "");
    let head, body;

    if (q.type === "choice") {
      head = `<div class="q">${num}<h2 class="q__text" id="q-${q.id}">${fill(q.label)}</h2></div>`;
      body = `<div class="choices ${q.layout === "grid" ? "choices--grid" : ""}" role="group" aria-labelledby="q-${q.id}">
        ${q.options.map((opt, k) => {
          const on = state.answers[q.id] === opt;
          return `<button type="button" class="choice ${on ? "is-on" : ""}" aria-pressed="${on}" data-choice="${esc(opt)}">
            <span class="choice__key">${KEYS[k]}</span><span class="choice__label">${esc(opt)}</span>${ICON_CHECK}</button>`;
        }).join("")}
      </div>`;
    } else {
      head = `<label class="q" for="f-${q.id}">${num}<span class="q__text">${fill(q.label)}</span></label>`;
      const common = `id="f-${q.id}" class="field" data-field="${q.id}" placeholder="${esc(q.placeholder || "")}"`;
      body = q.type === "textarea"
        ? `<textarea ${common} rows="3">${val}</textarea>`
        : `<input ${common} type="${q.type}" value="${val}" ${q.autocomplete ? `autocomplete="${q.autocomplete}"` : ""}>`;
    }

    const last = i === TOTAL - 1;
    const err = state.error ? `<p class="error" role="alert">${ICON_WARN} ${esc(state.error)}</p>` : "";
    return `<div class="screen">${head}${help}${body}</div>
      <div class="actions">${err}
        <div class="actions__row">
          <button type="button" class="btn ${last ? "btn--solid" : ""}" data-action="next" ${state.submitting ? "disabled" : ""}>
            ${last ? (state.submitting ? "SENDING…" : "SUBMIT") : "OK"} ${ICON_OK}</button>
          <span class="hint">press <strong>Enter ↵</strong></span>
        </div>
      </div>`;
  }

  function renderDone() {
    const d = CONFIG.done;
    return `<div class="screen" style="gap:26px;align-items:flex-start">
      <svg class="done-icon" width="88" height="88" viewBox="0 0 88 88" fill="none" aria-hidden="true">
        <circle cx="44" cy="44" r="40" stroke="currentColor" stroke-width="2"/>
        <circle cx="44" cy="44" r="26" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5"/>
        <path d="M33 45l8 8 15-17" stroke="currentColor" stroke-width="3"/>
      </svg>
      <span class="eyebrow">${esc(d.eyebrow)}</span>
      <h1 class="done-title glow">${esc(d.title)}</h1>
      <p class="done-text">${fill(d.text)}</p>
      <button type="button" class="btn" data-action="restart">START OVER</button>
    </div>`;
  }

  // keepScreen: re-render without replaying the entrance animation (e.g. showing an error)
  function render(keepScreen) {
    const s = state.step;
    const inQ = s >= 1 && s <= TOTAL;
    $stage.innerHTML = s === 0 ? renderWelcome() : inQ ? renderQuestion(Q[s - 1], s - 1) : renderDone();
    if (keepScreen) $stage.querySelectorAll(".screen").forEach((el) => (el.style.animation = "none"));

    $progress.style.width = (s === 0 ? 0 : inQ ? ((s - 1) / TOTAL) * 100 : 100) + "%";
    $counter.hidden = !inQ;
    $counter.textContent = `${pad(s)} / ${pad(TOTAL)}`;
    $nav.hidden = !inQ;
    $prev.disabled = s <= 1;

    const field = $stage.querySelector(".field");
    if (field) { field.focus(); const len = field.value.length; try { field.setSelectionRange(len, len); } catch (_) {} }
    else if (!keepScreen) $stage.querySelector(".choice.is-on, .choice, .btn")?.focus({ preventScroll: true });
  }

  async function next() {
    const s = state.step;
    if (s > TOTAL || state.submitting) return;
    if (s >= 1) {
      const err = validate(Q[s - 1]);
      if (err) { state.error = err; render(true); return; }
    }
    state.error = "";
    if (s === TOTAL) {
      state.submitting = true; render(true);
      try {
        await submitApplication({ ...state.answers });
        state.submitting = false; state.step++; render();
      } catch (e) {
        state.submitting = false; state.error = e.message || "Transmission failed. Try again."; render(true);
      }
      return;
    }
    state.step++; render();
  }

  function prev() {
    if (state.step > 1 && state.step <= TOTAL) { state.step--; state.error = ""; render(); }
  }

  function restart() {
    state.step = 0; state.answers = {}; state.error = ""; render();
  }

  function pick(value) {
    const q = Q[state.step - 1];
    state.answers[q.id] = value; state.error = "";
    render(true);
    clearTimeout(advanceTimer);
    const at = state.step;
    advanceTimer = setTimeout(() => { if (state.step === at) next(); }, 420);
  }

  // ---------- Events ----------
  $stage.addEventListener("click", (e) => {
    const c = e.target.closest("[data-choice]");
    if (c) return pick(c.dataset.choice);
    const a = e.target.closest("[data-action]");
    if (!a) return;
    if (a.dataset.action === "next") next();
    if (a.dataset.action === "restart") restart();
  });

  $stage.addEventListener("input", (e) => {
    const f = e.target.closest("[data-field]");
    if (!f) return;
    state.answers[f.dataset.field] = f.value;
    if (state.error) { state.error = ""; $stage.querySelector(".error")?.remove(); }
  });

  // Enter = next (Shift+Enter = newline in textarea). A–J picks a choice. Scoped to the form, not text fields.
  document.addEventListener("keydown", (e) => {
    const inField = e.target.matches?.(".field");
    if (e.key === "Enter" && !e.shiftKey && !e.target.matches?.("button")) {
      if (state.step <= TOTAL) { e.preventDefault(); next(); }
      return;
    }
    if (inField || e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q[state.step - 1];
    if (q && q.type === "choice") {
      const k = KEYS.indexOf(e.key.toUpperCase());
      if (k >= 0 && k < q.options.length) pick(q.options[k]);
    }
  });

  $prev.addEventListener("click", prev);
  $next.addEventListener("click", next);

  render();
})();
</script>
