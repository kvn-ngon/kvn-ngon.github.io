<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kevin Ngon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --chrome-light: #e8eaed;
      --chrome-mid:   #9aa0a8;
      --chrome-dark:  #3c4043;
      --chrome-shine: #ffffff;
      --bg:           #080a0c;
      --card-bg:      rgba(255,255,255,0.03);
      --card-border:  rgba(255,255,255,0.08);
      --card-hover:   rgba(255,255,255,0.07);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--chrome-light);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    .bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.13;
      animation: drift linear infinite;
    }

    .cloud-1 { width: 700px; height: 400px; background: #5a6170; top: -10%; left: -15%; animation-duration: 38s; animation-delay: 0s; }
    .cloud-2 { width: 500px; height: 300px; background: #8a9099; top: 20%; right: -10%; animation-duration: 52s; animation-delay: -12s; }
    .cloud-3 { width: 600px; height: 350px; background: #3d4550; top: 55%; left: 10%; animation-duration: 44s; animation-delay: -8s; }
    .cloud-4 { width: 400px; height: 250px; background: #6e7880; top: 70%; right: 5%; animation-duration: 60s; animation-delay: -20s; }
    .cloud-5 { width: 800px; height: 200px; background: #4a5260; top: 40%; left: 30%; animation-duration: 70s; animation-delay: -30s; }

    @keyframes drift {
      0%   { transform: translateX(0) translateY(0) scale(1); }
      25%  { transform: translateX(60px) translateY(-30px) scale(1.05); }
      50%  { transform: translateX(20px) translateY(40px) scale(0.97); }
      75%  { transform: translateX(-40px) translateY(20px) scale(1.03); }
      100% { transform: translateX(0) translateY(0) scale(1); }
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 80px;
    }

    .identity {
      text-align: center;
      margin-bottom: 56px;
      animation: fade-up 0.9s ease both;
    }

    .logo-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 12vw, 5.5rem);
      letter-spacing: 0.15em;
      line-height: 1;
      background: linear-gradient(
        160deg,
        var(--chrome-shine) 0%,
        var(--chrome-light) 20%,
        var(--chrome-mid) 45%,
        var(--chrome-light) 65%,
        var(--chrome-dark) 85%,
        var(--chrome-mid) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .handle {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: var(--chrome-mid);
    }

    .tagline {
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--chrome-dark);
    }

    .links {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      text-decoration: none;
      color: var(--chrome-light);
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
      animation: fade-up 0.9s ease both;
      animation-delay: 0.15s;
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      transition: left 0.5s ease;
    }

    .link-card:hover::before { left: 150%; }

    .link-card:hover {
      background: var(--card-hover);
      border-color: rgba(255,255,255,0.18);
      transform: translateY(-2px);
    }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    .link-label { flex: 1; }

    .link-arrow {
      font-size: 1rem;
      color: var(--chrome-dark);
      transition: color 0.2s, transform 0.2s;
    }

    .link-card:hover .link-arrow {
      color: var(--chrome-mid);
      transform: translateX(4px);
    }

    .footer {
      position: fixed;
      bottom: 24px;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--chrome-dark);
      text-transform: uppercase;
      z-index: 2;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .page { padding: 40px 16px 60px; }
      .identity { margin-bottom: 40px; }
    }
  </style>
</head>
<body>

  <div class="bg-wrap">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
  </div>
  <div class="grain"></div>

  <div class="page">

    <div class="identity">
      <div class="logo-wrap">
        <!-- Drop your logo into assets/logo.png — it will show here automatically -->
        <img src="assets/logo.png" alt="Kevin Ngon" onerror="this.style.display='none'" />
      </div>
      <h1 class="name">Kevin Ngon</h1>
      <p class="handle">@kvn.ngon</p>
      <p class="tagline">Foodie &nbsp;·&nbsp; Travel &nbsp;·&nbsp; Fitness Coach</p>
    </div>

    <div class="links">
      <a class="link-card" href="https://kvnngon.com/application">
        <div class="link-icon">📋</div>
        <span class="link-label">Apply for Coaching</span>
        <span class="link-arrow">→</span>
      </a>
    </div>

  </div>

  <p class="footer">© 2026 Kevin Ngon</p>

</body>
</html>
